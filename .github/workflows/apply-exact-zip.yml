name: Apply Exact ZIP

on:
  push:
    branches:
      - sync-full-zip
    paths:
      - '.exactb64/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          cat .exactb64/part* > /tmp/full.b64
          base64 -d /tmp/full.b64 > /tmp/full.tar.xz
          echo "4f939ffc34f29eaf70b165a4782099f9b7a5e35a4059771952b8c6a5c6d48b50  /tmp/full.tar.xz" | sha256sum -c -
          xz -t /tmp/full.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/full.tar.xz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync exact full submission from ZIP"
          git push origin HEAD:sync-full-zip
